[project]
name = "alfred"
version = "1.2.0"
description = "Alfred: a general-purpose voice agent for the Raspberry Pi 5, built for coding"
readme = "README.md"
authors = [{ name = "Vince Duero", email = "vince.duero@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[openai]>=1.14.0,<2",  # voice pipeline + GPT-Live service
    "claude-agent-sdk>=0.2.170,<0.3",  # the agent (bundles the Claude Code CLI)
    "livekit>=1.1.21,<2",             # only for its WebRTC echo canceller (no server)
    "sounddevice>=0.5",               # microphone and speaker
    "onnxruntime>=1.20",              # runs the wake-word models
    "numpy>=1.26",
    "loguru>=0.7",                    # same logger Pipecat uses, so all logs look alike
    "python-dotenv>=1.0",
    "pypdfium2>=5.15.2",
    "markitdown[docx,outlook,pptx,xls,xlsx]>=0.1.9",
    "pillow>=13.0.0",
    "sqlite-vec>=0.1.9",
    "openpyxl>=3.1.5",
    "rich>=15.0.0",
    "httpx>=0.28",
]

[project.scripts]
alfred = "alfred.__main__:main"
alfred-reset = "alfred.reset:main"
alfred-memory = "alfred.memory:main"
alfred-connect = "alfred.accounts:main"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""  # the package lives in ./alfred, not ./src/alfred

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Pipecat (pipecat/audio/utils.py) imports audioop, which Python 3.12 still has: not ours to fix
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
